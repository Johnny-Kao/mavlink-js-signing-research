name: JavaScript signing staging validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: ${{ matrix.variant }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ArduPilot/pymavlink
          ref: 544d9016f6e19fed105b28fb41e9ade19c45d8c2
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install upstream dependencies with upstream no-generation option
        run: |
          NOGEN=1 python -m pip install -e ./upstream
          python -m pip install pytest lxml flake8
          cd upstream/generator/javascript
          npm install --ignore-scripts --no-audit --no-fund
      - name: Apply minimal generator change for candidate
        if: matrix.variant == 'candidate'
        run: python scripts/apply_fix.py upstream
      - name: Install tests in pymavlink's existing test layout
        run: |
          cp staging/tests/test_javascript_signing_state.py upstream/tests/
          cp tests/signing-state.test.cjs upstream/tests/sysid32/
      - name: Lint Python generator and new pytest file
        run: |
          cd upstream
          python -m flake8 generator/mavgen_javascript.py tests/test_javascript_signing_state.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m compileall -q generator/mavgen_javascript.py tests/test_javascript_signing_state.py
      - name: Check new tests fail specifically on original generator
        if: matrix.variant == 'baseline'
        working-directory: upstream
        run: |
          set +e
          python -m pytest -q tests/test_javascript_signing_state.py > baseline.log 2>&1
          status=$?
          set -e
          cat baseline.log
          if [ "$status" -eq 0 ]; then
            echo "Unexpected: unmodified generator passes signing regression"
            exit 1
          fi
          if ! grep -q '# fail 6' baseline.log; then
            echo "Expected six Node assertion failures, not an environment or import failure"
            exit 1
          fi
          echo "Verified expected six regression failures on unmodified generator"
      - name: Run new regression through native pytest runner
        if: matrix.variant == 'candidate'
        working-directory: upstream
        run: python -m pytest -q tests/test_javascript_signing_state.py
      - name: Run upstream's existing signing tests
        if: matrix.variant == 'candidate'
        working-directory: upstream
        run: python -m pytest -q tests/test_signing_state.py
      - name: Run upstream's existing JavaScript generator tests
        if: matrix.variant == 'candidate'
        working-directory: upstream
        run: python -m pytest -q tests/test_sysid32_generators.py -k 'nextgen or javascript'
